<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #222536;
      --border: rgba(255,255,255,0.08);
      --text: #e2e8f0;
      --text-muted: #8892a4;
      --accent: #60a5fa;
      --accent2: #a78bfa;
      --radius: 16px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Layout ── */
    .app { max-width: 900px; margin: 0 auto; padding: 0 16px 48px; }

    /* ── Header ── */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 0 28px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .header-left { display: flex; flex-direction: column; gap: 2px; }

    .app-title {
      font-size: 1.1rem;
      font-weight: 700;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .current-datetime {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .header-right { display: flex; align-items: center; gap: 10px; }

    .search-toggle {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      padding: 9px 16px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: border-color 0.2s;
    }
    .search-toggle:hover { border-color: var(--accent); }

    .unit-toggle-wrap {
      display: flex;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
    }

    .unit-opt {
      padding: 9px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      transition: background 0.2s, color 0.2s;
    }
    .unit-opt:hover { color: var(--text); }
    .unit-opt.active {
      background: var(--accent);
      color: #fff;
    }

    /* ── Search panel ── */
    .search-panel {
      display: none;
      position: relative;
      margin-bottom: 20px;
    }
    .search-panel.open { display: block; }

    .search-input-wrap {
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 0 16px;
      gap: 10px;
    }

    .search-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 1rem;
      padding: 14px 0;
      font-family: inherit;
    }
    .search-input::placeholder { color: var(--text-muted); }

    .search-clear {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
    }
    .search-clear:hover { color: var(--text); }

    .suggestions {
      position: absolute;
      top: calc(100% + 6px);
      left: 0; right: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      list-style: none;
      z-index: 10;
      box-shadow: var(--shadow);
      display: none;
    }
    .suggestions.open { display: block; }
    .suggestions li {
      padding: 12px 16px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
      transition: background 0.15s;
    }
    .suggestions li:hover { background: rgba(255,255,255,0.06); }
    .suggestion-name { font-weight: 500; }
    .suggestion-sub { font-size: 0.82rem; color: var(--text-muted); }

    /* ── Permission / loading / error states ── */
    .state-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 16px;
      text-align: center;
      color: var(--text-muted);
    }

    .state-icon { font-size: 3.5rem; }
    .state-title { font-size: 1.2rem; font-weight: 600; color: var(--text); }
    .state-sub { font-size: 0.9rem; max-width: 360px; line-height: 1.6; }

    .btn-primary {
      margin-top: 8px;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.85; }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Dashboard ── */
    #dashboard { display: none; }

    /* ── Hero section ── */
    .hero {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 250px; height: 250px;
      background: radial-gradient(circle, rgba(96,165,250,0.07) 0%, transparent 70%);
      pointer-events: none;
    }

    .hero-location {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 20px;
    }

    .hero-city { font-size: 1.6rem; font-weight: 700; }
    .hero-region { font-size: 0.95rem; color: var(--text-muted); }

    .hero-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .hero-left { display: flex; align-items: center; gap: 20px; }

    .hero-emoji { font-size: 5rem; line-height: 1; }

    .hero-temp-block { display: flex; flex-direction: column; }
    .hero-temp {
      font-size: 5rem;
      font-weight: 800;
      letter-spacing: -3px;
      line-height: 1;
    }
    .hero-condition { font-size: 1.1rem; font-weight: 500; margin-top: 4px; }
    .hero-feels { font-size: 0.9rem; color: var(--text-muted); margin-top: 2px; }

    .hero-right {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 180px;
    }

    .hero-alert {
      background: rgba(251,191,36,0.1);
      border: 1px solid rgba(251,191,36,0.25);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.85rem;
      color: #fbbf24;
      line-height: 1.5;
    }

    .hero-summary {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.6;
      background: var(--surface2);
      border-radius: 10px;
      padding: 12px 14px;
    }

    /* ── Stats grid ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat-card-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
    }

    .stat-card-value {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .stat-card-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .stat-card-bar {
      height: 4px;
      background: var(--surface2);
      border-radius: 2px;
      margin-top: 4px;
      overflow: hidden;
    }
    .stat-card-bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    /* ── Hourly ── */
    .section-title {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .hourly-section { margin-bottom: 16px; }

    .hourly-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: thin;
      scrollbar-color: var(--surface2) transparent;
    }
    .hourly-scroll::-webkit-scrollbar { height: 4px; }
    .hourly-scroll::-webkit-scrollbar-track { background: transparent; }
    .hourly-scroll::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 2px; }

    .hourly-card {
      flex: 0 0 72px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: border-color 0.2s;
    }
    .hourly-card.now { border-color: rgba(96,165,250,0.4); }
    .hourly-card:not(.now):hover { border-color: rgba(255,255,255,0.14); }

    .hourly-time { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
    .hourly-time.now-label { color: var(--accent); }
    .hourly-emoji { font-size: 1.4rem; }
    .hourly-temp { font-size: 0.9rem; font-weight: 700; }
    .hourly-precip { font-size: 0.68rem; color: #60a5fa; }

    /* ── 7-day forecast ── */
    .forecast-section { margin-bottom: 16px; }

    .forecast-list {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .forecast-row {
      display: grid;
      grid-template-columns: 110px 48px 1fr 80px;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    .forecast-row:last-child { border-bottom: none; }
    .forecast-row:hover { background: rgba(255,255,255,0.02); }
    .forecast-row.today { background: rgba(96,165,250,0.04); }

    .forecast-day-label { font-weight: 600; font-size: 0.95rem; }
    .forecast-row-emoji { font-size: 1.5rem; text-align: center; }

    .forecast-bar-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
    }
    .forecast-lo { color: var(--text-muted); min-width: 36px; text-align: right; }
    .forecast-bar {
      flex: 1;
      height: 5px;
      background: var(--surface2);
      border-radius: 3px;
      position: relative;
      overflow: hidden;
    }
    .forecast-bar-fill {
      position: absolute;
      top: 0; bottom: 0;
      border-radius: 3px;
      background: linear-gradient(90deg, #60a5fa, #a78bfa);
    }
    .forecast-hi { color: var(--text); min-width: 36px; }

    .forecast-precip-label {
      font-size: 0.78rem;
      color: #60a5fa;
      text-align: right;
    }

    /* ── Footer ── */
    .app-footer {
      padding: 20px 0 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.78rem;
      border-top: 1px solid var(--border);
    }
    .app-footer a { color: var(--accent); text-decoration: none; }

    /* ── Night Sky Panel ── */
    .sky-section { margin-bottom: 16px; }

    .sky-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .sky-card {
      background: linear-gradient(160deg, #0d1224 0%, #141828 60%, #1a1230 100%);
      border: 1px solid rgba(167,139,250,0.2);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sky-card-header { display: flex; align-items: center; gap: 8px; }
    .sky-icon { font-size: 1rem; }
    .sky-card-title {
      font-size: 0.75rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted);
    }

    /* Moon */
    .moon-display { display: flex; align-items: center; gap: 14px; }
    .moon-emoji { font-size: 2.8rem; line-height: 1; }
    .moon-info { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .moon-name { font-weight: 600; font-size: 1rem; }
    .illum-bar-wrap { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
    .illum-bar { height: 100%; background: linear-gradient(90deg, #a78bfa, #e879f9); border-radius: 2px; }
    .moon-illum { font-size: 0.75rem; color: var(--text-muted); }
    .moon-next {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.06);
    }
    .moon-next-label { font-size: 0.82rem; color: var(--text-muted); }
    .moon-next-days { font-size: 0.82rem; font-weight: 600; color: #a78bfa; }

    /* Stargazing */
    .stargaze-score-wrap { display: flex; align-items: baseline; gap: 10px; }
    .stargaze-score { font-size: 2.4rem; font-weight: 800; line-height: 1; }
    .stargaze-denom { font-size: 1rem; font-weight: 400; opacity: 0.6; }
    .stargaze-label { font-size: 1rem; font-weight: 600; }
    .stargaze-tip { font-size: 0.82rem; color: var(--text-muted); line-height: 1.4; }
    .stargaze-cloud {
      font-size: 0.75rem; color: var(--text-muted);
      margin-top: auto; padding-top: 4px; border-top: 1px solid rgba(255,255,255,0.06);
    }

    /* Golden Hour */
    .golden-row { display: flex; align-items: flex-start; gap: 10px; }
    .golden-badge {
      font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; padding: 2px 6px; border-radius: 4px;
      white-space: nowrap; margin-top: 1px; flex-shrink: 0;
    }
    .golden-badge.golden { background: rgba(251,191,36,0.18); color: #fbbf24; border: 1px solid rgba(251,191,36,0.3); }
    .golden-badge.blue { background: rgba(96,165,250,0.15); color: #60a5fa; border: 1px solid rgba(96,165,250,0.25); }
    .golden-times { display: flex; flex-direction: column; gap: 3px; font-size: 0.82rem; }

    /* Upcoming Events */
    .event-row { display: flex; gap: 10px; align-items: flex-start; }
    .event-icon-wrap { font-size: 1.4rem; flex-shrink: 0; margin-top: 1px; }
    .event-body { display: flex; flex-direction: column; gap: 2px; }
    .event-name { font-weight: 600; font-size: 0.88rem; }
    .event-date { font-size: 0.8rem; color: #a78bfa; font-weight: 500; }
    .event-note { font-size: 0.75rem; color: var(--text-muted); line-height: 1.4; }
    .event-divider { height: 1px; background: rgba(255,255,255,0.06); margin: 2px 0; }

    /* ── Responsive ── */

    /* Tablet (≤ 768px) */
    @media (max-width: 768px) {
      .hero { padding: 24px 20px; }
      .hero-city { font-size: 1.4rem; }
      .hero-location { flex-wrap: wrap; }
      .stat-card-value { font-size: 1.3rem; }
    }

    /* Large phone / small tablet portrait (≤ 640px) */
    @media (max-width: 640px) {
      .app { padding: 0 12px 40px; }
      .app-header { padding: 16px 0 20px; gap: 10px; }

      .hero { padding: 20px 16px; }
      .hero-city { font-size: 1.25rem; }
      .hero-region { font-size: 0.85rem; }
      .hero-temp { font-size: 3.8rem; letter-spacing: -2px; }
      .hero-emoji { font-size: 3.5rem; }
      .hero-right { min-width: unset; width: 100%; }
      .hero-main { gap: 16px; }
      .hero-condition { font-size: 1rem; }

      .stats-grid { grid-template-columns: repeat(2, 1fr); }

      .forecast-row { grid-template-columns: 88px 38px 1fr 62px; gap: 8px; padding: 12px 14px; }
      .forecast-day-label { font-size: 0.88rem; }

      .sky-grid { grid-template-columns: 1fr; }
      .moon-emoji { font-size: 2.4rem; }
    }

    /* Small phones (≤ 480px) */
    @media (max-width: 480px) {
      .search-toggle { font-size: 0.82rem; padding: 8px 12px; }
      .unit-opt { padding: 8px 10px; font-size: 0.82rem; }

      .hero-temp { font-size: 3.2rem; }
      .hero-emoji { font-size: 3rem; }

      .forecast-row { grid-template-columns: 76px 34px 1fr 54px; gap: 6px; padding: 10px 12px; }
      .forecast-day-label { font-size: 0.82rem; }
      .forecast-precip-label { font-size: 0.72rem; }

      .stat-card { padding: 14px 14px; }
      .stat-card-value { font-size: 1.2rem; }
    }

    /* Very small phones (≤ 360px) */
    @media (max-width: 360px) {
      .app { padding: 0 10px 32px; }
      .hero { padding: 16px 14px; }
      .hero-temp { font-size: 2.8rem; }
      .hero-emoji { font-size: 2.6rem; }
      .forecast-row { grid-template-columns: 64px 30px 1fr 48px; gap: 4px; padding: 9px 10px; }
      .forecast-day-label { font-size: 0.75rem; }
    }
  </style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="header-left">
      <span class="app-title">Weather</span>
      <span class="current-datetime" id="datetime"></span>
    </div>
    <div class="header-right">
      <button class="search-toggle" id="searchToggleBtn">🔍 Search city</button>
      <div class="unit-toggle-wrap" id="unitToggleBtn">
        <span class="unit-opt active" id="unitC">°C</span>
        <span class="unit-opt" id="unitF">°F</span>
      </div>
    </div>
  </header>

  <div class="search-panel" id="searchPanel">
    <div class="search-input-wrap">
      <span>🔍</span>
      <input class="search-input" id="searchInput" type="text" placeholder="Search for a city..." autocomplete="off" />
      <button class="search-clear" id="searchClear">✕</button>
    </div>
    <ul class="suggestions" id="suggestions"></ul>
  </div>

  <!-- States -->
  <div id="stateScreen" class="state-screen">
    <div class="state-icon">🌍</div>
    <div class="state-title" id="stateTitle">Detecting your location...</div>
    <p class="state-sub" id="stateSub">Or search for a city using the button above.</p>
    <button class="btn-primary" id="allowLocationBtn" style="display:none">Try again</button>
  </div>

  <div id="loadingScreen" class="state-screen" style="display:none;">
    <div class="spinner"></div>
    <p>Fetching weather...</p>
  </div>

  <div id="errorScreen" class="state-screen" style="display:none;">
    <div class="state-icon">⚠️</div>
    <div class="state-title" id="errorTitle">Something went wrong</div>
    <p class="state-sub" id="errorSub">Please try again.</p>
    <button class="btn-primary" id="retryBtn">Try again</button>
  </div>

  <!-- Dashboard -->
  <div id="dashboard">

    <div class="hero">
      <div class="hero-location">
        <span class="hero-city" id="heroCity"></span>
        <span class="hero-region" id="heroRegion"></span>
      </div>
      <div class="hero-main">
        <div class="hero-left">
          <span class="hero-emoji" id="heroEmoji"></span>
          <div class="hero-temp-block">
            <span class="hero-temp" id="heroTemp"></span>
            <span class="hero-condition" id="heroCondition"></span>
            <span class="hero-feels" id="heroFeels"></span>
          </div>
        </div>
        <div class="hero-right" id="heroRight"></div>
      </div>
    </div>

    <div class="stats-grid" id="statsGrid"></div>

    <div class="hourly-section">
      <div class="section-title">Next 24 hours</div>
      <div class="hourly-scroll" id="hourlyScroll"></div>
    </div>

    <div class="forecast-section">
      <div class="section-title">7-Day Forecast</div>
      <div class="forecast-list" id="forecastList"></div>
    </div>

    <div class="sky-section">
      <div class="section-title">Night Sky</div>
      <div class="sky-grid" id="skyGrid"></div>
    </div>

  </div>

  <footer class="app-footer">
    <p>Data from <a href="https://open-meteo.com/" target="_blank" rel="noreferrer">Open-Meteo</a> · location never stored</p>
  </footer>
</div>

<script>
  // ── Astronomy ────────────────────────────────────────────────
  const SYNODIC_PERIOD = 29.53058867;
  const REF_NEW_MOON = new Date('2000-01-06T18:14:00Z').getTime();

  function getMoonPhase(date) {
    const daysSince = (date.getTime() - REF_NEW_MOON) / 86400000;
    const phase = ((daysSince % SYNODIC_PERIOD) + SYNODIC_PERIOD) % SYNODIC_PERIOD;
    const illumination = Math.round(((1 - Math.cos((phase / SYNODIC_PERIOD) * 2 * Math.PI)) / 2) * 100);
    const daysToFull = phase <= 14.765 ? 14.765 - phase : SYNODIC_PERIOD - phase + 14.765;
    const daysToNew  = SYNODIC_PERIOD - phase;
    let name, emoji;
    if      (phase < 1.85)  { name = 'New Moon';        emoji = '🌑'; }
    else if (phase < 7.38)  { name = 'Waxing Crescent'; emoji = '🌒'; }
    else if (phase < 9.22)  { name = 'First Quarter';   emoji = '🌓'; }
    else if (phase < 14.77) { name = 'Waxing Gibbous';  emoji = '🌔'; }
    else if (phase < 16.61) { name = 'Full Moon';       emoji = '🌕'; }
    else if (phase < 22.15) { name = 'Waning Gibbous';  emoji = '🌖'; }
    else if (phase < 23.99) { name = 'Last Quarter';    emoji = '🌗'; }
    else                    { name = 'Waning Crescent';  emoji = '🌘'; }
    return { phase, name, emoji, illumination, daysToFull, daysToNew };
  }

  // Shift an Open-Meteo local-time ISO string (e.g. "2026-08-12T06:15") by N minutes
  // without using Date() to avoid UTC-offset issues
  function shiftTime(isoStr, minutes) {
    const timePart = (isoStr.split('T')[1] || '00:00').slice(0, 5);
    const [hh, mm] = timePart.split(':');
    let total = parseInt(hh, 10) * 60 + parseInt(mm, 10) + minutes;
    total = ((total % 1440) + 1440) % 1440;
    const newH = Math.floor(total / 60), newM = total % 60;
    const ampm = newH < 12 ? 'AM' : 'PM';
    const h12 = newH === 0 ? 12 : newH > 12 ? newH - 12 : newH;
    return `${h12}:${String(newM).padStart(2, '0')} ${ampm}`;
  }

  function getGoldenHours(sunriseIso, sunsetIso) {
    return {
      morningBlueStart:  shiftTime(sunriseIso, -30),
      morningBlueEnd:    shiftTime(sunriseIso,   0),
      morningGoldStart:  shiftTime(sunriseIso,   0),
      morningGoldEnd:    shiftTime(sunriseIso,  60),
      eveningGoldStart:  shiftTime(sunsetIso,  -60),
      eveningGoldEnd:    shiftTime(sunsetIso,    0),
      eveningBlueStart:  shiftTime(sunsetIso,    0),
      eveningBlueEnd:    shiftTime(sunsetIso,   30),
    };
  }

  const ECLIPSE_TABLE = [
    { date: '2026-08-12', type: 'Total',   regions: 'Arctic, Greenland, Spain, West Africa' },
    { date: '2027-08-02', type: 'Total',   regions: 'Morocco, Egypt, Saudi Arabia, India' },
    { date: '2028-07-22', type: 'Total',   regions: 'Australia, New Zealand' },
    { date: '2030-06-01', type: 'Annular', regions: 'Europe, North Africa, Central Asia' },
    { date: '2030-11-25', type: 'Total',   regions: 'Namibia, South Africa, Indian Ocean' },
    { date: '2031-05-21', type: 'Annular', regions: 'NW Africa, Mediterranean, Arabian Peninsula' },
    { date: '2033-03-30', type: 'Total',   regions: 'Alaska, Siberia' },
    { date: '2034-03-20', type: 'Total',   regions: 'Central Africa, Saudi Arabia, India, China' },
    { date: '2035-09-02', type: 'Total',   regions: 'China, Korea, Japan, Pacific' },
  ];

  function getNextSolarEclipse(now) {
    for (const e of ECLIPSE_TABLE) {
      const eDate = new Date(e.date + 'T12:00:00Z');
      const daysUntil = Math.ceil((eDate.getTime() - now.getTime()) / 86400000);
      if (daysUntil >= 0) {
        const displayDate = eDate.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
        return { ...e, displayDate, daysUntil };
      }
    }
    return { ...ECLIPSE_TABLE[ECLIPSE_TABLE.length - 1], displayDate: '', daysUntil: 0 };
  }

  const SHOWERS = [
    { name: 'Quadrantids',   month: 1,  day:  3, rate: 120, desc: 'Swift blue meteors from asteroid 2003 EH1' },
    { name: 'Lyrids',        month: 4,  day: 22, rate:  18, desc: 'Debris from Comet Thatcher, one of the oldest showers' },
    { name: 'Eta Aquariids', month: 5,  day:  6, rate:  50, desc: "Halley's Comet debris, best in the southern hemisphere" },
    { name: 'Perseids',      month: 8,  day: 12, rate: 100, desc: 'Bright fast meteors from Comet Swift-Tuttle' },
    { name: 'Orionids',      month: 10, day: 21, rate:  20, desc: "More of Halley's Comet, noted for glowing trains" },
    { name: 'Leonids',       month: 11, day: 17, rate:  15, desc: 'Comet Tempel-Tuttle — famous for historic meteor storms' },
    { name: 'Geminids',      month: 12, day: 13, rate: 120, desc: 'Best annual shower — slow brilliant fireballs from asteroid Phaethon' },
  ];

  function getNextMeteorShower(now) {
    for (let offset = 0; offset <= 1; offset++) {
      const year = now.getFullYear() + offset;
      for (const s of SHOWERS) {
        const peak = new Date(year, s.month - 1, s.day, 12, 0, 0);
        const daysUntil = Math.ceil((peak.getTime() - now.getTime()) / 86400000);
        if (daysUntil >= -1) {
          const peakDate = peak.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
          return { name: s.name, peakDate, daysUntil: Math.max(0, daysUntil), rate: s.rate, desc: s.desc };
        }
      }
    }
    const next = new Date(now.getFullYear() + 1, 0, 3, 12, 0, 0);
    return { name: 'Quadrantids', peakDate: next.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }),
      daysUntil: Math.ceil((next.getTime() - now.getTime()) / 86400000), rate: 120, desc: 'Swift blue meteors from asteroid 2003 EH1' };
  }

  function getStargazingIndex(cloudCover) {
    const score = Math.round((1 - cloudCover / 100) * 10);
    if (score >= 9) return { score, label: 'Perfect',     color: '#a78bfa', tip: 'Galaxy visible to the naked eye' };
    if (score >= 7) return { score, label: 'Excellent',   color: '#818cf8', tip: 'Great night for astrophotography' };
    if (score >= 5) return { score, label: 'Good',        color: '#60a5fa', tip: 'Most stars clearly visible' };
    if (score >= 3) return { score, label: 'Fair',        color: '#fbbf24', tip: 'Bright stars and planets only' };
    if (score >= 1) return { score, label: 'Poor',        color: '#fb923c', tip: 'Heavy cloud cover tonight' };
    return            { score, label: 'Clouded Out',      color: '#f87171', tip: 'No stars visible tonight' };
  }

  function daysLabel(n) {
    if (n === 0) return 'Today';
    if (n === 1) return 'Tomorrow';
    if (n < 30)  return `In ${n} days`;
    const m = Math.round(n / 30.44);
    return `In ~${m} month${m !== 1 ? 's' : ''}`;
  }

  function renderSkyPanel(c, d) {
    const now = new Date();
    const moon = getMoonPhase(now);
    const golden = getGoldenHours(d.sunrise[0], d.sunset[0]);
    const eclipse = getNextSolarEclipse(now);
    const shower = getNextMeteorShower(now);
    const star = getStargazingIndex(c.cloud_cover);
    const milestone = moon.daysToFull <= moon.daysToNew
      ? { label: 'Full Moon', days: moon.daysToFull }
      : { label: 'New Moon',  days: moon.daysToNew };

    $('skyGrid').innerHTML = `
      <div class="sky-card">
        <div class="sky-card-header"><span class="sky-icon">🌙</span><span class="sky-card-title">Moon Phase</span></div>
        <div class="moon-display">
          <span class="moon-emoji">${moon.emoji}</span>
          <div class="moon-info">
            <span class="moon-name">${moon.name}</span>
            <div class="illum-bar-wrap"><div class="illum-bar" style="width:${moon.illumination}%"></div></div>
            <span class="moon-illum">${moon.illumination}% illuminated</span>
          </div>
        </div>
        <div class="moon-next">
          <span class="moon-next-label">${milestone.label}</span>
          <span class="moon-next-days">${daysLabel(Math.round(milestone.days))}</span>
        </div>
      </div>

      <div class="sky-card">
        <div class="sky-card-header"><span class="sky-icon">⭐</span><span class="sky-card-title">Stargazing Tonight</span></div>
        <div class="stargaze-score-wrap">
          <span class="stargaze-score" style="color:${star.color}">${star.score}<span class="stargaze-denom">/10</span></span>
          <span class="stargaze-label" style="color:${star.color}">${star.label}</span>
        </div>
        <p class="stargaze-tip">${star.tip}</p>
        <p class="stargaze-cloud">Cloud cover: ${c.cloud_cover}%</p>
      </div>

      <div class="sky-card">
        <div class="sky-card-header"><span class="sky-icon">🌅</span><span class="sky-card-title">Golden &amp; Blue Hour</span></div>
        <div class="golden-row">
          <span class="golden-badge golden">Golden</span>
          <div class="golden-times">
            <span>${golden.morningGoldStart} – ${golden.morningGoldEnd}</span>
            <span>${golden.eveningGoldStart} – ${golden.eveningGoldEnd}</span>
          </div>
        </div>
        <div class="golden-row">
          <span class="golden-badge blue">Blue</span>
          <div class="golden-times">
            <span>${golden.morningBlueStart} – ${golden.morningBlueEnd}</span>
            <span>${golden.eveningBlueStart} – ${golden.eveningBlueEnd}</span>
          </div>
        </div>
      </div>

      <div class="sky-card">
        <div class="sky-card-header"><span class="sky-icon">🔭</span><span class="sky-card-title">Upcoming Events</span></div>
        <div class="event-row">
          <div class="event-icon-wrap">🌑</div>
          <div class="event-body">
            <span class="event-name">${eclipse.type} Solar Eclipse</span>
            <span class="event-date">${eclipse.displayDate} · ${daysLabel(eclipse.daysUntil)}</span>
            <span class="event-note">${eclipse.regions}</span>
          </div>
        </div>
        <div class="event-divider"></div>
        <div class="event-row">
          <div class="event-icon-wrap">☄️</div>
          <div class="event-body">
            <span class="event-name">${shower.name} Meteor Shower</span>
            <span class="event-date">${shower.peakDate} · ${daysLabel(shower.daysUntil)}</span>
            <span class="event-note">Up to ${shower.rate}/hr · ${shower.desc}</span>
          </div>
        </div>
      </div>`;
  }

  // ── State ────────────────────────────────────────────────────
  let unit = 'celsius';
  let currentLoc = null;
  let debounceTimer = null;
  let searchOpen = false;

  // ── Utils ────────────────────────────────────────────────────
  const $ = id => document.getElementById(id);

  function ul() { return unit === 'celsius' ? '°C' : '°F'; }

  function getDescription(code) {
    if (code === 0) return 'Clear sky';
    if (code <= 1) return 'Mainly clear';
    if (code <= 2) return 'Partly cloudy';
    if (code === 3) return 'Overcast';
    if (code <= 49) return 'Fog';
    if (code <= 57) return 'Drizzle';
    if (code <= 67) return 'Rain';
    if (code <= 77) return 'Snow';
    if (code <= 82) return 'Rain showers';
    if (code <= 86) return 'Snow showers';
    if (code <= 99) return 'Thunderstorm';
    return 'Unknown';
  }

  function getEmoji(code, isDay = 1) {
    if (code === 0) return isDay ? '☀️' : '🌙';
    if (code <= 2) return isDay ? '🌤️' : '🌤️';
    if (code === 3) return '☁️';
    if (code <= 49) return '🌫️';
    if (code <= 57) return '🌦️';
    if (code <= 67) return '🌧️';
    if (code <= 77) return '❄️';
    if (code <= 82) return '🌧️';
    if (code <= 86) return '🌨️';
    if (code <= 99) return '⛈️';
    return '🌡️';
  }

  function formatDay(dateStr, index) {
    if (index === 0) return 'Today';
    if (index === 1) return 'Tomorrow';
    return new Date(dateStr + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long' });
  }

  function formatHour(isoStr) {
    // Same issue as formatTime — parse directly to avoid UTC shift
    const timePart = isoStr.split('T')[1] || '00:00';
    const h = parseInt(timePart.split(':')[0], 10);
    return h === 0 ? '12 AM' : h < 12 ? `${h} AM` : h === 12 ? '12 PM' : `${h - 12} PM`;
  }

  function formatTime(isoStr) {
    // Open-Meteo returns local-time strings with no timezone suffix.
    // Parsing via Date() treats them as UTC, shifting the time.
    // Parse the hours/minutes directly from the string instead.
    const timePart = isoStr.split('T')[1] || '00:00';
    const [hh, mm] = timePart.split(':');
    const hour = parseInt(hh, 10);
    const ampm = hour < 12 ? 'AM' : 'PM';
    const h12 = hour === 0 ? 12 : hour > 12 ? hour - 12 : hour;
    return `${h12}:${mm} ${ampm}`;
  }

  function windDirection(deg) {
    const dirs = ['N','NE','E','SE','S','SW','W','NW'];
    return dirs[Math.round(deg / 45) % 8];
  }

  function uvLabel(uv) {
    if (uv <= 2) return { label: 'Low', color: '#4ade80' };
    if (uv <= 5) return { label: 'Moderate', color: '#facc15' };
    if (uv <= 7) return { label: 'High', color: '#fb923c' };
    if (uv <= 10) return { label: 'Very High', color: '#f87171' };
    return { label: 'Extreme', color: '#e879f9' };
  }

  function humidityLabel(h) {
    if (h < 30) return 'Dry';
    if (h < 60) return 'Comfortable';
    if (h < 80) return 'Humid';
    return 'Very humid';
  }

  function buildSummary(c, daily) {
    const parts = [];
    const rain = daily.precipitation_probability_max[0];
    if (rain >= 70) parts.push(`High chance of rain today (${rain}%)`);
    else if (rain >= 40) parts.push(`Some rain possible today (${rain}%)`);

    if (c.wind_speed_10m > 30) parts.push(`Strong winds — ${Math.round(c.wind_speed_10m)} mph`);
    else if (c.wind_speed_10m > 20) parts.push(`Breezy at ${Math.round(c.wind_speed_10m)} mph`);

    const hi = Math.round(daily.temperature_2m_max[0]);
    const lo = Math.round(daily.temperature_2m_min[0]);
    parts.push(`High of ${hi}${ul()}, low of ${lo}${ul()} today`);

    return parts.join(' · ');
  }

  function buildAlerts(c, uv) {
    const alerts = [];
    if (uv >= 8) alerts.push('🕶️ Extreme UV — stay covered');
    else if (uv >= 6) alerts.push('☀️ High UV — sunscreen recommended');
    if (c.wind_gusts_10m > 45) alerts.push('💨 Dangerous gusts');
    if (c.weather_code >= 95) alerts.push('⛈️ Thunderstorm conditions');
    if (c.temperature_2m < (unit === 'fahrenheit' ? 32 : 0)) alerts.push('🧊 Freezing temperatures');
    return alerts.join('\n');
  }

  // ── Clock ────────────────────────────────────────────────────
  function updateClock() {
    $('datetime').textContent = new Date().toLocaleString('en-US', {
      weekday: 'long', month: 'short', day: 'numeric',
      hour: 'numeric', minute: '2-digit'
    });
  }
  updateClock();
  setInterval(updateClock, 30000);

  // ── API ──────────────────────────────────────────────────────
  async function searchLocations(query) {
    const res = await fetch(
      `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=6&language=en&format=json`
    );
    const data = await res.json();
    return data.results || [];
  }

  async function fetchWeather(loc) {
    const tempUnit = unit === 'celsius' ? 'celsius' : 'fahrenheit';
    const res = await fetch(
      `https://api.open-meteo.com/v1/forecast` +
      `?latitude=${loc.latitude}&longitude=${loc.longitude}` +
      `&current=temperature_2m,apparent_temperature,relative_humidity_2m,` +
      `wind_speed_10m,wind_gusts_10m,wind_direction_10m,precipitation,` +
      `weather_code,is_day,cloud_cover,visibility` +
      `&hourly=temperature_2m,weather_code,is_day,precipitation_probability,wind_speed_10m,uv_index` +
      `&daily=temperature_2m_max,temperature_2m_min,weather_code,` +
      `precipitation_sum,precipitation_probability_max,wind_speed_10m_max,sunrise,sunset` +
      `&temperature_unit=${tempUnit}&wind_speed_unit=mph&timezone=auto&forecast_days=7`
    );
    return res.json();
  }

  // ── Render ───────────────────────────────────────────────────
  function renderDashboard(loc, data) {
    const c = data.current;
    const d = data.daily;
    const h = data.hourly;

    // Find current hour index in hourly array.
    // Use the API's own current.time (already in location-local timezone)
    // instead of new Date().toISOString() which is UTC and would mismatch.
    const currentHourPrefix = data.current.time.slice(0, 13); // e.g. "2026-07-13T15"
    let currentHourIdx = h.time.findIndex(t => t.startsWith(currentHourPrefix));
    if (currentHourIdx < 0) currentHourIdx = 0;

    const currentUV = h.uv_index[currentHourIdx] ?? 0;

    // Hero
    $('heroCity').textContent = loc.name;
    $('heroRegion').textContent = [loc.admin1, loc.country].filter(Boolean).join(', ');
    $('heroEmoji').textContent = getEmoji(c.weather_code, c.is_day);
    $('heroTemp').textContent = `${Math.round(c.temperature_2m)}${ul()}`;
    $('heroCondition').textContent = getDescription(c.weather_code);
    $('heroFeels').textContent = `Feels like ${Math.round(c.apparent_temperature)}${ul()}`;

    const alerts = buildAlerts(c, currentUV);
    const summary = buildSummary(c, d);
    $('heroRight').innerHTML =
      (alerts ? `<div class="hero-alert">${alerts.replace(/\n/g,'<br>')}</div>` : '') +
      `<div class="hero-summary">${summary}</div>`;

    // Stats
    const uvInfo = uvLabel(currentUV);
    const vis = c.visibility !== undefined ? (c.visibility / 1000).toFixed(1) + ' km' : '—';
    const stats = [
      {
        label: 'UV Index',
        value: Math.round(currentUV),
        sub: uvInfo.label,
        bar: { fill: Math.min(currentUV / 12, 1), color: uvInfo.color }
      },
      {
        label: 'Humidity',
        value: `${c.relative_humidity_2m}%`,
        sub: humidityLabel(c.relative_humidity_2m),
        bar: { fill: c.relative_humidity_2m / 100, color: '#60a5fa' }
      },
      {
        label: 'Wind',
        value: `${Math.round(c.wind_speed_10m)} mph`,
        sub: `${windDirection(c.wind_direction_10m)} · gusts ${Math.round(c.wind_gusts_10m)} mph`,
      },
      {
        label: 'Cloud Cover',
        value: `${c.cloud_cover}%`,
        sub: c.cloud_cover < 25 ? 'Clear' : c.cloud_cover < 60 ? 'Partly cloudy' : 'Overcast',
        bar: { fill: c.cloud_cover / 100, color: '#94a3b8' }
      },
      {
        label: 'Sunrise',
        value: formatTime(d.sunrise[0]),
        sub: `Sunset ${formatTime(d.sunset[0])}`,
      },
      {
        label: 'Visibility',
        value: vis,
        sub: c.visibility > 10000 ? 'Clear' : c.visibility > 4000 ? 'Moderate' : 'Poor',
      },
    ];

    $('statsGrid').innerHTML = stats.map(s => `
      <div class="stat-card">
        <div class="stat-card-label">${s.label}</div>
        <div class="stat-card-value">${s.value}</div>
        <div class="stat-card-sub">${s.sub}</div>
        ${s.bar ? `
          <div class="stat-card-bar">
            <div class="stat-card-bar-fill" style="width:${Math.round(s.bar.fill*100)}%;background:${s.bar.color}"></div>
          </div>` : ''}
      </div>`).join('');

    // Hourly — next 24 hours from current
    const hourlyCards = [];
    for (let i = currentHourIdx; i < Math.min(currentHourIdx + 25, h.time.length); i++) {
      const isNow = i === currentHourIdx;
      const precip = h.precipitation_probability[i];
      hourlyCards.push(`
        <div class="hourly-card ${isNow ? 'now' : ''}">
          <span class="hourly-time ${isNow ? 'now-label' : ''}">${isNow ? 'Now' : formatHour(h.time[i])}</span>
          <span class="hourly-emoji">${getEmoji(h.weather_code[i], h.is_day[i])}</span>
          <span class="hourly-temp">${Math.round(h.temperature_2m[i])}${ul()}</span>
          ${precip > 0 ? `<span class="hourly-precip">💧${precip}%</span>` : '<span class="hourly-precip"></span>'}
        </div>`);
    }
    $('hourlyScroll').innerHTML = hourlyCards.join('');

    // Forecast — compute relative bar widths
    const allMax = d.temperature_2m_max;
    const allMin = d.temperature_2m_min;
    const rangeMin = Math.min(...allMin);
    const rangeMax = Math.max(...allMax);
    const totalRange = rangeMax - rangeMin || 1;

    $('forecastList').innerHTML = d.time.map((date, i) => {
      const lo = Math.round(allMin[i]);
      const hi = Math.round(allMax[i]);
      const barLeft = (allMin[i] - rangeMin) / totalRange;
      const barWidth = (allMax[i] - allMin[i]) / totalRange;
      const precip = d.precipitation_probability_max[i];
      return `
        <div class="forecast-row ${i === 0 ? 'today' : ''}">
          <span class="forecast-day-label">${formatDay(date, i)}</span>
          <span class="forecast-row-emoji">${getEmoji(d.weather_code[i])}</span>
          <div class="forecast-bar-wrap">
            <span class="forecast-lo">${lo}${ul()}</span>
            <div class="forecast-bar">
              <div class="forecast-bar-fill" style="left:${barLeft*100}%;width:${barWidth*100}%"></div>
            </div>
            <span class="forecast-hi">${hi}${ul()}</span>
          </div>
          <span class="forecast-precip-label">${precip > 0 ? `💧 ${precip}%` : ''}</span>
        </div>`;
    }).join('');

    renderSkyPanel(c, d);
    showDashboard();
  }

  // ── Screen management ────────────────────────────────────────
  function showState(name) {
    $('stateScreen').style.display  = name === 'state'   ? 'flex' : 'none';
    $('loadingScreen').style.display = name === 'loading' ? 'flex' : 'none';
    $('errorScreen').style.display  = name === 'error'   ? 'flex' : 'none';
    $('dashboard').style.display    = name === 'dashboard' ? 'block' : 'none';
  }

  function showDashboard() { showState('dashboard'); }

  function showError(title, sub, retry) {
    showState('error');
    $('errorTitle').textContent = title;
    $('errorSub').textContent = sub;
    $('retryBtn').onclick = retry;
  }

  // ── Load weather ─────────────────────────────────────────────
  async function loadWeather(loc) {
    currentLoc = loc;
    showState('loading');
    try {
      const data = await fetchWeather(loc);
      renderDashboard(loc, data);
    } catch (e) {
      showError('Could not load weather', 'Check your internet connection.', () => loadWeather(loc));
    }
  }

  async function tryIPGeo() {
    // Try multiple free IP geo services in order
    const services = [
      async () => {
        const r = await fetch('https://ipwho.is/');
        const d = await r.json();
        if (!d.success || !d.latitude) throw new Error('ipwho.is: ' + (d.message || 'no data'));
        return { name: d.city, admin1: d.region, country: d.country, latitude: d.latitude, longitude: d.longitude };
      },
      async () => {
        const r = await fetch('https://freeipapi.com/api/json');
        const d = await r.json();
        if (!d.latitude) throw new Error('freeipapi: no lat');
        return { name: d.cityName, admin1: d.regionName, country: d.countryName, latitude: d.latitude, longitude: d.longitude };
      },
      async () => {
        const r = await fetch('https://ipapi.co/json/');
        const d = await r.json();
        if (!d.latitude) throw new Error('ipapi.co: no lat');
        return { name: d.city, admin1: d.region, country: d.country_name, latitude: d.latitude, longitude: d.longitude };
      },
    ];

    let lastErr = '';
    for (const fn of services) {
      try { return await fn(); } catch (e) { lastErr = e.message; }
    }
    throw new Error('All services failed: ' + lastErr);
  }

  async function autoDetectLocation() {
    showState('loading');
    try {
      const loc = await tryIPGeo();
      await loadWeather(loc);
    } catch (e) {
      showState('state');
      $('stateTitle').textContent = 'Could not detect location';
      $('stateSub').textContent = 'Search for your city using the button above. (Error: ' + e.message + ')';
      $('allowLocationBtn').style.display = 'none';
      searchOpen = true;
      searchPanel.classList.add('open');
      searchInput.focus();
    }
  }

  // ── Search ───────────────────────────────────────────────────
  const searchPanel = $('searchPanel');
  const suggestionsList = $('suggestions');
  const searchInput = $('searchInput');

  $('searchToggleBtn').addEventListener('click', () => {
    searchOpen = !searchOpen;
    searchPanel.classList.toggle('open', searchOpen);
    if (searchOpen) searchInput.focus();
  });

  $('searchClear').addEventListener('click', () => {
    searchInput.value = '';
    closeSuggestions();
    searchInput.focus();
  });

  searchInput.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    const q = searchInput.value.trim();
    if (!q) { closeSuggestions(); return; }
    debounceTimer = setTimeout(async () => {
      try {
        const results = await searchLocations(q);
        if (!results.length) { closeSuggestions(); return; }
        suggestionsList.innerHTML = results.map((r, i) => {
          const sub = [r.admin1, r.country].filter(Boolean).join(', ');
          return `<li data-index="${i}">
            <span class="suggestion-name">${r.name}</span>
            <span class="suggestion-sub">${sub}</span>
          </li>`;
        }).join('');
        suggestionsList._results = results;
        suggestionsList.classList.add('open');
      } catch { closeSuggestions(); }
    }, 350);
  });

  suggestionsList.addEventListener('click', e => {
    const li = e.target.closest('li');
    if (!li) return;
    const r = suggestionsList._results[parseInt(li.dataset.index)];
    const loc = {
      name: r.name,
      admin1: r.admin1 || '',
      country: r.country || '',
      latitude: r.latitude,
      longitude: r.longitude,
    };
    searchInput.value = '';
    closeSuggestions();
    searchOpen = false;
    searchPanel.classList.remove('open');
    loadWeather(loc);
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('.search-panel') && !e.target.closest('#searchToggleBtn')) {
      closeSuggestions();
    }
  });

  function closeSuggestions() {
    suggestionsList.innerHTML = '';
    suggestionsList.classList.remove('open');
    suggestionsList._results = [];
  }

  // ── Unit toggle ──────────────────────────────────────────────
  function setUnit(newUnit) {
    unit = newUnit;
    $('unitC').classList.toggle('active', unit === 'celsius');
    $('unitF').classList.toggle('active', unit === 'fahrenheit');
    if (currentLoc) loadWeather(currentLoc);
  }

  $('unitC').addEventListener('click', () => { if (unit !== 'celsius') setUnit('celsius'); });
  $('unitF').addEventListener('click', () => { if (unit !== 'fahrenheit') setUnit('fahrenheit'); });

  // ── Allow location btn ───────────────────────────────────────
  $('allowLocationBtn').addEventListener('click', autoDetectLocation);

  // ── Auto-detect on load ──────────────────────────────────────
  autoDetectLocation();
</script>
</body>
</html>
